<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="在瀏覽器內處理圖片的繁體中文修圖工作台"><title>光室 · 本機修圖</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><a class="brand" href="./"><span class="logo">◈</span> 光室 <small>LIGHTROOM LOCAL</small></a><div class="tabs"><button id="photoTab" class="active">圖片編輯</button><button id="videoTab">影片工具</button></div><span class="private">◉ 檔案留在你的裝置</span><button id="exportTop" class="primary">匯出作品</button></header>
<div class="workspace"><nav id="tools" aria-label="編輯工具"></nav><aside><div class="panel-head"><span id="toolEyebrow">開始創作</span><h1 id="toolTitle">新增圖片</h1></div><div id="settings"></div><div class="aside-foot"><span>▣ 本機處理</span><p>圖片與影片不會上傳。AI 首次使用需下載模型。</p><button id="capabilities">第一版功能狀態</button></div></aside>
<main><div class="canvas-toolbar"><div class="file-info"><span id="filename">未命名作品</span><small id="dimensions">尚未加入圖片</small></div><div class="history"><button id="undo" title="復原 Ctrl+Z" aria-label="復原">↶</button><button id="redo" title="重做 Ctrl+Shift+Z" aria-label="重做">↷</button><i></i><button id="reset">重置</button><button id="compare">◧ 按住對比</button></div></div><div id="stage" tabindex="0" aria-label="編輯畫布"><div id="empty"><div class="empty-icon">▧<span>＋</span></div><h2>好作品，從一張圖片開始</h2><p>把圖片拖曳到這裡，或直接貼上</p><button class="primary" id="emptyImport">選擇圖片</button><small>PNG、JPG、WebP · 全程在瀏覽器處理</small></div><div id="artboard" hidden><canvas id="canvas"></canvas><canvas id="overlay"></canvas><div id="split" hidden><span>↔</span></div><div id="compareLabels" hidden><span>處理前</span><span>處理後</span></div></div><div id="videoBox" hidden><video id="video" controls playsinline></video><canvas id="videoOverlay"></canvas></div><div id="busy" hidden><div class="busy-card"><div class="spinner"></div><h2>生成中</h2><p id="progressText">準備處理…</p><progress id="progress" max="100"></progress><button id="cancel">取消處理</button></div></div></div><div id="timeline" hidden><button id="play">播放 / 暫停</button><input type="range" id="seek" min="0" max="100" value="0" step="0.01" aria-label="影片時間軸"><span id="time">0:00</span></div><footer><span id="hint">拖曳或貼上圖片開始編輯</span><div class="zoom-controls"><button id="zoomOut" aria-label="縮小">−</button><button id="zoomLabel">100%</button><button id="zoomIn" aria-label="放大">＋</button><button id="fit">適合畫面</button></div></footer></main></div>
<input id="file" type="file" accept="image/png,image/jpeg,image/webp,image/avif" hidden><input id="videoFile" type="file" accept="video/mp4,video/webm" hidden><div id="toast" role="status" hidden></div><dialog id="dialog"><button class="close" aria-label="關閉">✕</button><div id="dialogContent"></div></dialog><script type="module" src="app.js"></script></body></html>
